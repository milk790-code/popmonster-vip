name: Prepare Deployment Bundle

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**
  workflow_dispatch:
    inputs:
      publish_bundle:
        description: "Push popmonster-pages.zip to popmonster-website-deployment"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create bundle zip
        run: |
          # 建立臨時目錄用於轉換後的檔案
          mkdir -p bundle

          # 複製所有 HTML；只有商品頁 a001.html 轉成 A001.html
          shopt -s nullglob
          for file in *.html; do
            if [ -f "$file" ]; then
              case "$file" in
                a[0-9][0-9][0-9].html) target_name="A${file#a}" ;;
                *) target_name="$file" ;;
              esac
              cp "$file" "bundle/$target_name"
            fi
          done

          # 複製其他必要的檔案
          cp products_catalog.js bundle/products.json 2>/dev/null || true
          cp manifest.json bundle/ 2>/dev/null || true
          cp robots.txt bundle/ 2>/dev/null || true
          cp CNAME bundle/ 2>/dev/null || true

          # 複製資源檔案
          cp -r css bundle/ 2>/dev/null || true
          cp -r js bundle/ 2>/dev/null || true
          cp -r img bundle/ 2>/dev/null || true
          cp -r assets bundle/ 2>/dev/null || true

          # 生成 zip
          cd bundle
          zip -r ../popmonster-pages.zip . -x "*.git*"
          cd ..
          ls -lh popmonster-pages.zip

      - name: Upload deployment bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: popmonster-pages
          path: popmonster-pages.zip

      - name: Push to deployment repo
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_bundle }}
        env:
          DEPLOYMENT_REPO: popmonster-website-deployment
          DEPLOYMENT_REPO_TOKEN: ${{ secrets.DEPLOYMENT_REPO_TOKEN }}
        run: |
          if [ -z "${DEPLOYMENT_REPO_TOKEN}" ]; then
            echo "DEPLOYMENT_REPO_TOKEN is required to publish the bundle." >&2
            exit 1
          fi

          # Clone deployment repo
          git clone https://x-access-token:${DEPLOYMENT_REPO_TOKEN}@github.com/${{ github.repository_owner }}/${DEPLOYMENT_REPO}.git deploy-repo

          # 替換 zip 檔案
          cp popmonster-pages.zip deploy-repo/

          # 進入 deployment repo 並提交
          cd deploy-repo
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add popmonster-pages.zip
          git commit -m "chore: update popmonster-pages bundle from popmonster-vip [skip ci]" || echo "No changes to commit"
          git push origin main
