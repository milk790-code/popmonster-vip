<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>訂單確認 · POP MONSTER</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0a;color:#f0e6c8;font-family:'Noto Sans TC',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#111;border:1px solid #c9a84c;border-radius:16px;max-width:460px;width:100%;padding:40px 32px;text-align:center}
  .icon{font-size:56px;margin-bottom:24px}
  h1{font-size:24px;color:#c9a84c;font-weight:700;margin-bottom:8px}
  .sub{font-size:15px;color:#b0a090;margin-bottom:28px;line-height:1.6}
  .divider{border:none;border-top:1px solid #2a2a2a;margin:24px 0}
  .step{display:flex;align-items:flex-start;gap:12px;text-align:left;margin-bottom:16px}
  .step-num{background:#c9a84c;color:#0a0a0a;font-weight:800;font-size:13px;
    width:24px;height:24px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;flex-shrink:0;margin-top:1px}
  .step-text{font-size:14px;color:#d0c4a8;line-height:1.5}
  .btn{display:block;margin-top:28px;background:#c9a84c;color:#0a0a0a;
    font-weight:700;font-size:15px;padding:14px 24px;border-radius:10px;
    text-decoration:none;transition:opacity .2s}
  .btn:hover{opacity:.85}
  .btn-line{background:#06c755;color:#fff;margin-top:12px}
  .note{font-size:12px;color:#6a5f50;margin-top:20px;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🫧</div>
  <h1>訂單送出成功</h1>
  <p class="sub">感謝你選擇 Pop Monster！<br>付款完成後 24–48 小時出貨。</p>

  <hr class="divider">

  <div class="step">
    <div class="step-num">1</div>
    <div class="step-text">綠界付款確認 Email 已寄出（請查收垃圾信）</div>
  </div>
  <div class="step">
    <div class="step-num">2</div>
    <div class="step-text">我們收到付款後會安排出貨，並透過 LINE 通知你</div>
  </div>
  <div class="step">
    <div class="step-num">3</div>
    <div class="step-text">收到商品後，歡迎回到 LINE 跟小怪說效果如何 🐾</div>
  </div>

  <hr class="divider">

  <a class="btn btn-line" href="https://line.me/R/ti/p/@150tiznd">回到 LINE · 查詢訂單</a>
  <a class="btn" href="https://popmonster.vip">繼續逛逛</a>

  <p class="note">如有問題請透過 LINE 聯絡，或 Email：service@popmonster.vip</p>
</div>
</body>
</html>
